name: game_v1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  supabase_flutter: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:  # Lists assets, such as image files
    - assets/images/
    - assets/fonts/

  fonts:              # Required if your app uses custom fonts
  - family: Motley_Forces
    fonts:
      - asset: assets/fonts/Motley_Forces.ttf


